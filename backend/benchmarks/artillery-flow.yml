config:
  target: "http://127.0.0.1:3000"
  phases:
    - name: "Warm-up"
      duration: 30
      arrivalRate: 5
    - name: "Ramp"
      duration: 60
      arrivalRate: 10
      rampTo: 50
    - name: "Sustained"
      duration: 60
      arrivalRate: 50
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Citizen User Flow"
    flow:
      - post:
          url: "/api/auth/citizen/login"
          json:
            email: "artillery_user@civicfix.local"
            password: "Password123!"
          capture:
            - json: "$.token"
              as: "authToken"
      - get:
          url: "/api/posts?page=1&limit=10"
          headers:
            Authorization: "Bearer {{ authToken }}"
      - post:
          url: "/api/posts/create"
          headers:
            Authorization: "Bearer {{ authToken }}"
          json:
            title: "Load Test Issue - Pothole on Sector 4"
            description: "Automated issue report generated by Artillery load test suite"
            category: "road"
            location:
              latitude: 28.6139
              longitude: 77.2090
            photos:
              - url: "https://res.cloudinary.com/dp1wvqbkv/image/upload/v1/sample.jpg"
                publicId: "sample_loadtest"
          capture:
            - json: "$.post._id"
              as: "createdPostId"
      - get:
          url: "/api/posts/{{ createdPostId }}"
          headers:
            Authorization: "Bearer {{ authToken }}"
